<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>きらきら文芸部</title>
    <style>
        body {
            margin: 0;
            background: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
            overflow: hidden;
        }

        #game-container {
            width: 800px;
            height: 600px;
            position: relative;
            background: #fdf6f0;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            border-radius: 8px;
        }

        /* 背景レイヤー */
        #scene-layer {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, #ffe4e1, #ffffff);
            background-image: radial-gradient(#ffb6c1 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* キャラクターレイヤー */
        #character-layer {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            pointer-events: none;
        }

        .character {
            width: 250px;
            height: 380px;
            position: absolute;
            bottom: -20px;
            transition: all 0.4s ease;
            opacity: 0;
            transform: translateY(20px);
        }

        .char-show {
            opacity: 1;
            transform: translateY(0);
        }

        .pos-left { left: 50px; }
        .pos-center { left: 275px; z-index: 10; }
        .pos-right { right: 50px; }

        /* UIレイヤー (テキストボックス) */
        #ui-layer {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            height: 160px;
            background: rgba(255, 248, 250, 0.95);
            border: 4px solid #ffb6c1;
            border-radius: 15px;
            padding: 25px;
            box-sizing: border-box;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.1s;
            z-index: 50; /* キャラクターより手前に表示させる */
        }

        #ui-layer:active {
            transform: scale(0.99);
        }

        #name-box {
            position: absolute;
            top: -20px;
            left: 10px;
            background: #ffb6c1;
            color: white;
            padding: 5px 25px;
            font-weight: bold;
            border-radius: 20px;
            font-size: 1.2rem;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
            display: none;
        }

        #text-box {
            font-size: 1.4rem;
            color: #4a4a4a;
            line-height: 1.6;
        }

        /* 詩のミニゲーム用スタイル */
        #poem-game-layer, #poem-result-layer {
            position: absolute;
            inset: 0;
            z-index: 100; /* テキストボックス(50)よりも確実に手前に表示 */
            /* ノート風の背景 */
            background-color: #fdfaf6;
            background-image: linear-gradient(#e5d8c8 1px, transparent 1px);
            background-size: 100% 3rem;
            background-position: 0 1.5rem;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 5%;
            pointer-events: auto;
            color: #4a4a4a;
            overflow-y: auto; /* はみ出た場合は縦スクロールを許可する */
        }

        .poem-title {
            font-size: 2rem;
            font-weight: bold;
            color: #ff6b81;
            margin-bottom: 10px;
            background: rgba(253, 250, 246, 0.9);
            padding: 5px 20px;
            border-radius: 20px;
        }

        #poem-words-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            max-width: 80%;
            margin-top: 20px;
        }

        .poem-word-btn {
            background: #fff;
            border: 2px solid #ffb6c1;
            padding: 10px 25px;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }
        
        .poem-word-btn:hover {
            background: #ffb6c1;
            color: white;
            transform: translateY(-2px);
        }

        .poem-word-btn.selected {
            background: #eee;
            border-color: #ccc;
            color: #999;
            box-shadow: none;
            transform: none;
        }

        #finished-poem-content {
            font-size: 1.6rem;
            line-height: 2;
            text-align: center;
            margin: 30px 0;
            font-family: serif;
        }
        
        .finish-btn {
            background: #ff6b81;
            color: white;
            font-size: 1.3rem;
            padding: 10px 30px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }

        .finish-btn:hover {
            transform: scale(1.05);
        }

    </style>
</head>
<body>

<div id="game-container">
    <div id="scene-layer"></div>
    <div id="character-layer"></div>
    
    <div id="ui-layer" onclick="nextLine()">
        <div id="name-box"></div>
        <div id="text-box"></div>
    </div>

    <!-- 詩作成ミニゲームレイヤー -->
    <div id="poem-game-layer">
        <div class="poem-title">詩を書こう！</div>
        <div style="font-size: 1.2rem; font-weight:bold; background: rgba(253,250,246,0.9); padding: 5px;">
            好きな言葉を選んでね (残り: <span id="words-left">7</span>個)
        </div>
        <div id="poem-words-container">
            <!-- 単語ボタンがここに生成されます -->
        </div>
    </div>

    <!-- 詩完成結果レイヤー -->
    <div id="poem-result-layer">
        <div class="poem-title">完成した詩</div>
        <div id="finished-poem-content"></div>
        <button class="finish-btn" onclick="endPoemGame()">みんなに見せる</button>
    </div>
</div>

<script>
/**
 * キャラクター生成用SVG (表情差分対応)
 */
function getCharSVG(name, expression = "normal") {
    const colors = {
        "サユリ": { hair: "#ffaa99", bow: "#ff5555", uniform: "#e0d8d0", tie: "#ff5555" }, // 元気
        "ナツミ": { hair: "#ff99cc", bow: "#cc0066", uniform: "#e0d8d0", tie: "#cc0066" }, // ツンデレ
        "ユリカ": { hair: "#9966cc", bow: "#4b0082", uniform: "#e0d8d0", tie: "#4b0082" }, // クール
        "モモカ": { hair: "#99cc99", bow: "#228b22", uniform: "#e0d8d0", tie: "#228b22" }  // 部長
    };
    const c = colors[name] || colors["サユリ"];
    
    // 表情パーツ
    let eyes = `<path d="M 35 60 Q 40 55 45 60" stroke="#333" stroke-width="2" fill="transparent"/>
                <path d="M 55 60 Q 60 55 65 60" stroke="#333" stroke-width="2" fill="transparent"/>`;
    let mouth = `<path d="M 45 75 Q 50 80 55 75" stroke="#333" stroke-width="1.5" fill="transparent"/>`; 

    if (expression === "smile") {
        eyes = `<path d="M 35 60 Q 40 50 45 60" stroke="#333" stroke-width="2" fill="transparent"/>
                <path d="M 55 60 Q 60 50 65 60" stroke="#333" stroke-width="2" fill="transparent"/>`;
        mouth = `<path d="M 45 75 Q 50 85 55 75 Z" fill="#ff9999" stroke="#333" stroke-width="1"/>`;
    } else if (expression === "sad") {
        eyes = `<path d="M 35 60 Q 40 65 45 60" stroke="#333" stroke-width="2" fill="transparent"/>
                <path d="M 55 60 Q 60 65 65 60" stroke="#333" stroke-width="2" fill="transparent"/>`;
        mouth = `<path d="M 45 80 Q 50 75 55 80" stroke="#333" stroke-width="1.5" fill="transparent"/>`;
    }
    
    return `
    <svg viewBox="0 0 100 150" xmlns="http://www.w3.org/2000/svg" style="width:100%; height:100%;">
        <!-- 後ろ髪 -->
        <path d="M 20 50 Q 50 10 80 50 L 85 100 L 15 100 Z" fill="${c.hair}"/>
        <!-- 制服 -->
        <path d="M 25 150 L 30 90 Q 50 100 70 90 L 75 150 Z" fill="${c.uniform}"/>
        <!-- 襟 -->
        <path d="M 30 90 L 50 120 L 70 90 Z" fill="#fff"/>
        <!-- リボン -->
        <path d="M 40 110 L 50 125 L 60 110 Z" fill="${c.tie}"/>
        <circle cx="50" cy="113" r="3" fill="#ffcc00"/>
        <!-- 顔 -->
        <circle cx="50" cy="55" r="28" fill="#ffe0bd"/>
        <!-- 目と口 -->
        ${eyes}
        ${mouth}
        <!-- 前髪 -->
        <path d="M 18 55 Q 50 15 82 55 Q 50 35 18 55 Z" fill="${c.hair}"/>
        <!-- 髪飾り -->
        <circle cx="80" cy="40" r="5" fill="${c.bow}"/>
    </svg>`;
}

// 詩作りのデータ
const poemWordsData = [
    { word: "太陽", target: "route_sayuri" }, { word: "笑顔", target: "route_sayuri" },
    { word: "お菓子", target: "route_sayuri" }, { word: "友達", target: "route_sayuri" },
    { word: "ぽかぽか", target: "route_sayuri" }, { word: "ピクニック", target: "route_sayuri" },
    { word: "元気", target: "route_sayuri" },
    
    { word: "怒り", target: "route_natsumi" }, { word: "孤独", target: "route_natsumi" },
    { word: "イヤホン", target: "route_natsumi" }, { word: "情熱", target: "route_natsumi" },
    { word: "ギター", target: "route_natsumi" }, { word: "反逆", target: "route_natsumi" },
    { word: "ビート", target: "route_natsumi" },
    
    { word: "宇宙", target: "route_yurika" }, { word: "深淵", target: "route_yurika" },
    { word: "夢", target: "route_yurika" }, { word: "永遠", target: "route_yurika" },
    { word: "静寂", target: "route_yurika" }, { word: "星屑", target: "route_yurika" },
    { word: "幻影", target: "route_yurika" },

    // 接続詞・装飾詞を追加
    { word: "そして", target: "route_sayuri" }, { word: "だからこそ", target: "route_sayuri" }, { word: "いつも", target: "route_sayuri" },
    { word: "だけど", target: "route_natsumi" }, { word: "なぜなら", target: "route_natsumi" }, { word: "突然", target: "route_natsumi" },
    { word: "まるで", target: "route_yurika" }, { word: "ゆえに", target: "route_yurika" }, { word: "静かに", target: "route_yurika" },
    { word: "しかし", target: "route_natsumi" }, { word: "あるいは", target: "route_yurika" }, { word: "また", target: "route_sayuri" }
];

// シナリオデータ
const scenario = {
    "start": [
        { text: "文芸部の部室のドアを開けると..." },
        { speaker: "サユリ", text: "あっ、新しい部員の人だ！いらっしゃい！", char: "サユリ", pos: "center", exp: "smile" },
        { speaker: "ナツミ", text: "ふーん、あんたが新入部員？ 私はナツミ。よろしく。", char: "ナツミ", pos: "right", exp: "normal" },
        { speaker: "ユリカ", text: "初めまして... ユリカと申します...。", char: "ユリカ", pos: "left", exp: "sad" },
        { speaker: "主人公", text: "（なんだこの空間... 美少女しかいない...！）" },
        { speaker: "モモカ", text: "ところで、今日はみんなで詩を書いてくるっていう宿題があったわよね？", char: "モモカ", pos: "center", clear: true, exp: "smile" },
        { speaker: "モモカ", text: "せっかくだから、今ここでテーマに沿ってノートに自分の詩を書き出してみて！", exp: "smile" },
        { type: "poem_minigame" }
    ],
    "route_sayuri": [
        { speaker: "サユリ", text: "えへへっ、あなたの詩、太陽みたいにぽかぽかしてて私大好き！", char: "サユリ", pos: "center", clear: true, exp: "smile" },
        { speaker: "サユリ", text: "これからも一緒に楽しく詩を書こうね！", exp: "smile" },
        { text: "こうして、サユリとの騒がしくも楽しい日々が始まった。 [END]" }
    ],
    "route_natsumi": [
        { speaker: "ナツミ", text: "アンタの詩... なんだか胸に刺さる言葉が多いわね。嫌いじゃないわ。", char: "ナツミ", pos: "center", clear: true, exp: "smile" },
        { speaker: "ナツミ", text: "またいつでも私の詩の相談に乗ってあげてもいいわよ。", exp: "smile" },
        { text: "こうして、ナツミとの少し刺激的な日々が始まった。 [END]" }
    ],
    "route_yurika": [
        { speaker: "ユリカ", text: "あなたの詩、とても深く幻想的な響きがありますね...。素敵です。", char: "ユリカ", pos: "center", clear: true, exp: "smile" },
        { speaker: "ユリカ", text: "ふふっ、なんだか心の中を見透かされているようです...", exp: "smile" },
        { text: "こうして、ユリカとの静かで穏やかな日々が始まった。 [END]" }
    ]
};

// ゲーム状態変数
let currentScene = "start";
let currentLineIndex = 0;
let isTyping = false;
let currentTextInterval;
let fullText = "";
let poemWordsLeft = 7;
let selectedWords = [];
let poemScores = { "route_sayuri": 0, "route_natsumi": 0, "route_yurika": 0 };

// DOM要素
const textBox = document.getElementById('text-box');
const nameBox = document.getElementById('name-box');
const characterLayer = document.getElementById('character-layer');

function showLine() {
    const line = scenario[currentScene][currentLineIndex];
    if (!line) return;

    clearInterval(currentTextInterval);
    textBox.innerHTML = "";
    isTyping = true;
    
    // 詩のミニゲームの処理
    if (line.type === "poem_minigame") {
        startPoemMinigame();
        return;
    }

    // キャラクターの描画処理
    if (line.clear) {
        characterLayer.innerHTML = '';
    }

    if (line.char && line.pos) {
        const existingChar = document.getElementById(`char-${line.char}`);
        const svgContent = getCharSVG(line.char, line.exp || "normal");

        if (existingChar) {
            existingChar.innerHTML = svgContent;
            existingChar.className = `character pos-${line.pos} char-show`;
        } else {
            const charDiv = document.createElement('div');
            charDiv.id = `char-${line.char}`;
            charDiv.className = `character pos-${line.pos}`;
            charDiv.innerHTML = svgContent;
            characterLayer.appendChild(charDiv);
            
            // フェードインアニメーション用
            setTimeout(() => {
                charDiv.classList.add('char-show');
            }, 50);
        }
    }

    // 名前の表示
    if (line.speaker) {
        nameBox.style.display = "block";
        nameBox.innerText = line.speaker;
    } else {
        nameBox.style.display = "none";
    }

    // テキストタイプライター演出
    fullText = line.text;
    let charIndex = 0;
    
    currentTextInterval = setInterval(() => {
        textBox.innerHTML += fullText.charAt(charIndex);
        charIndex++;
        if (charIndex >= fullText.length) {
            clearInterval(currentTextInterval);
            isTyping = false;
        }
    }, 40); // 文字送りスピード
}

function nextLine() {
    if (isTyping) {
        // タイピング中なら一気に表示
        clearInterval(currentTextInterval);
        textBox.innerHTML = fullText;
        isTyping = false;
        return;
    }

    currentLineIndex++;
    if (currentLineIndex < scenario[currentScene].length) {
        showLine();
    }
}

// =======================
// 詩作成ミニゲームの処理
// =======================
function startPoemMinigame() {
    poemWordsLeft = 7;
    selectedWords = [];
    poemScores = { "route_sayuri": 0, "route_natsumi": 0, "route_yurika": 0 };
    
    // 詩を作成中は邪魔にならないようにテキストボックスを隠す
    document.getElementById('ui-layer').style.display = 'none';
    document.getElementById('poem-game-layer').style.display = 'flex';
    document.getElementById('words-left').innerText = poemWordsLeft;
    
    const container = document.getElementById('poem-words-container');
    container.innerHTML = '';
    
    // 配列をシャッフルして表示
    let shuffled = [...poemWordsData].sort(() => 0.5 - Math.random());
    
    shuffled.forEach(item => {
        const btn = document.createElement('div');
        btn.className = 'poem-word-btn';
        btn.innerText = item.word;
        btn.onclick = () => selectPoemWord(item, btn);
        container.appendChild(btn);
    });
}

function selectPoemWord(item, btnElement) {
    if (poemWordsLeft <= 0 || btnElement.classList.contains('selected')) return;
    
    btnElement.classList.add('selected');
    btnElement.style.pointerEvents = 'none';
    
    selectedWords.push(item.word);
    poemScores[item.target]++;
    poemWordsLeft--;
    
    document.getElementById('words-left').innerText = poemWordsLeft;
    
    // 画面全体を少し跳ねさせる（演出）
    const layer = document.getElementById('poem-game-layer');
    layer.style.transform = 'translateY(-10px)';
    setTimeout(() => { layer.style.transform = 'translateY(0)'; }, 100);

    if (poemWordsLeft <= 0) {
        setTimeout(showPoemResult, 800);
    }
}

function showPoemResult() {
    document.getElementById('poem-game-layer').style.display = 'none';
    document.getElementById('poem-result-layer').style.display = 'flex';
    
    const content = document.getElementById('finished-poem-content');
    
    let poemText = "";
    
    // 名詞を繋ぐための詩的なフレーズ
    const phrases = [
        "のなかで",
        "と",
        "に揺れる",
        "を想う",
        "が満ちて",
        "の向こうへ"
    ];

    let nounCount = 0;
    
    selectedWords.forEach((word, index) => {
        let isModifier = word.match(/^(そして|だからこそ|だけど|なぜなら|まるで|しかし|あるいは|ゆえに|また|いつも|突然|静かに)/);
        
        if (isModifier) {
            // 接続詞や副詞の場合は余韻を持たせる
            poemText += `<span style="font-size: 1.2rem; color: #777;">${word}......</span><br>`;
        } else {
            nounCount++;
            let styledWord = `&nbsp;&nbsp;<span style="font-size: 1.8rem; font-weight: bold; color: #333;">${word}</span>`;
            
            // 最後の単語の場合
            if (index === selectedWords.length - 1) {
                poemText += styledWord + `<span style="font-size: 1.2rem; color: #555;">。</span><br>`;
            } else {
                // 次の単語をチェック
                let nextWord = selectedWords[index + 1];
                let nextIsModifier = nextWord && nextWord.match(/^(そして|だからこそ|だけど|なぜなら|まるで|しかし|あるいは|ゆえに|また|いつも|突然|静かに)/);
                
                if (nextIsModifier) {
                    // 次が接続詞なら一旦区切る
                    poemText += styledWord + `<span style="font-size: 1.2rem; color: #555;">の世界。</span><br><br>`;
                } else {
                    // 名詞が連続する場合はフレーズで繋ぐ
                    let phrase = phrases[nounCount % phrases.length];
                    poemText += styledWord + `<span style="font-size: 1.2rem; color: #555;">${phrase}</span><br>`;
                }
            }
        }
    });

    content.innerHTML = poemText;
}

function endPoemGame() {
    document.getElementById('poem-result-layer').style.display = 'none';
    
    // 詩の作成が終わったらテキストボックスを再表示する
    document.getElementById('ui-layer').style.display = 'block';
    
    // 一番スコアが高いルートを判定
    let maxScore = -1;
    let targetRoute = "route_sayuri"; // デフォルト
    
    for (const [route, score] of Object.entries(poemScores)) {
        if (score > maxScore) {
            maxScore = score;
            targetRoute = route;
        }
    }
    
    // 選ばれたルートへ遷移
    currentScene = targetRoute;
    currentLineIndex = 0;
    
    // キャラクターリセット
    characterLayer.innerHTML = '';
    
    showLine();
}

// ゲーム開始
window.onload = () => {
    showLine();
};
</script>
</body>
</html>
